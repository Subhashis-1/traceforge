services:
  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: traceforge
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 30s
      timeout: 10s
      retries: 5

  go-builder:
    image: golang:1.22-alpine
    volumes:
      - .:/src
    working_dir: /src
    command: sh -c "apk add --no-cache git make && echo 'Dependencies installed' && tail -f /dev/null"
    depends_on:
      cassandra:
        condition: service_healthy

volumes:
  cassandra-data:
